roster(){if(UI.edit)return charEdit();const q=UI.q.toLowerCase();const l=S.coms.filter(c=>(!UI.fs||c.status===UI.fs)&&(c.name+c.stage+c.loc).toLowerCase().includes(q));

erformative wealth, pretension, looking down on others, needless complexity, hypocrisy, false certainty, status competitions and confidence mistaken for wisdom. Not cynical: he celebrates real progress and people who improve their circumstances.`],

const tc=s=>s.trim().toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase());
function parseBible(txt){
const R={f:{},b:{},unk:[],ign:0},lines=txt.replace(/\r/g,'').split('\n').map(s=>s.trim());
const fi=lines.findIndex(s=>s);let skip=-1;const first=lines[fi]||'';
if(first&&/\s[—–-]\s/.test(first)&&!/:/.test(first)&&first.length<90){const p=first.split(/\s[—–-]\s/);R.b.name=tc(p[0]);if(!/profile|bible|studio|character/i.test(p[1]))R.b.stage=tc(p[1]);skip=fi}
let cur=null,buf=[];
const put=(k,i,t)=>{const key=k+'|'+i;(R.f[key]=R.f[key]||[]).push(t)};
const flush=()=>{if(cur){const t=buf.filter(x=>x&&!/^[-–—_=*]{3,}$/.test(x)).map(x=>x.replace(/^[-•*]\s+/,''));if(t.length)put(cur[0],cur[1],(cur[2]?cur[2]+'\n':'')+t.join('\n'))}buf=[]};
const KEY=/^[-•*]?\s*(full name|name|stage identity|stage name|stage|age|nationality|current residence|location|associated shows|languages|accent|cultural background)\s*:\s*(.+)$/i;
lines.forEach((s,ix)=>{if(ix===skip)return;
const n=nrm(s.replace(/^\d+[.)]\s*/,'')),isH=s&&!/[.:]$/.test(s)&&s.length<70&&!/^[-•*]/.test(s);
if(isH){if(BASIC.includes(n)){flush();cur=null;return}if(SE[n]){flush();cur=null;return}if(AL[n]){flush();cur=AL[n];return}}
if(!cur){const m=s.match(KEY);if(m){const k=m[1].toLowerCase(),v=m[2].trim(),w=v.replace(/\.$/,'');
if(k==='full name'||k==='name')R.b.name=w;else if(/^stage/.test(k))R.b.stage=w;else if(k==='age')R.b.age=parseInt(v)||R.b.age;else if(k==='current residence'||k==='location')R.b.loc=w;else if(k==='associated shows')R.b.shows=w;else if(k==='nationality')put('identity',0,'Nationality: '+v);else if(k==='cultural background')put('identity',0,v);else if(k==='languages')put('identity',1,v);else if(k==='accent')put('identity',2,v);return}}
if(cur){buf.push(s);if(isH&&s.split(' ').length<=6&&/^[A-Z]/.test(s)&&!lines[ix-1])R.unk.push(s)}else if(s&&!/^[-–—_=*]{3,}$/.test(s))R.ign++});
flush();R.fields={};for(const key in R.f){const[k,i]=key.split('|');(R.fields[k]=R.fields[k]||{})[SEC[k][+i]]=R.f[key].join('\n\n')}return R}

try{let list;if(live()){const r=await ai(`You are the writers' room for a comedy network. Write ORIGINAL material in the voice of ONE fictional comedian. Stay strictly inside their character bible, honour boundaries, treat background details as shaping worldview and word choice, never as required ingredients, and do not repeat previous material.\n\nCHARACTER BIBLE\n${bibleText(c)}\nPREVIOUS MATERIAL\n${recent(c.id)}\n\nOTHER COMEDIANS ON THE SAME SUBJECT (do not reuse their premises, images, titles or escalation endpoints)\n${others(c.id,w.subj)}\n\nBRIEF\nSubject: ${w.subj}\nFormat: ${w.fmt}\nAudience: ${w.aud}\nTone: ${w.tone}\nTarget length: ${w.dur}\nHumour intensity: ${w.int}/10\nCandidates: ${w.n}\n\nCRAFT RULES (v2). VOICE: imitate the rhythm of the VOICE sample lines, never their content or wording. CATCHPHRASES: at most one recognisable catchphrase per piece, optional, never in every piece, and not the ones used in PREVIOUS MATERIAL; natural speech beats catchphrase insertion. RUNNING JOKES: optional resources only; do not insert recurring anecdotes, metaphors or earlier punchlines unless creatively justified; most pieces should use none. BACKGROUND: location, culture and biography shape worldview and vocabulary; they are not joke ingredients; no location-specific references unless the subject needs them; never mention a detail just because it is listed. STRUCTURE: each candidate needs a different premise and shape, and must not reuse the structure of PREVIOUS MATERIAL. Follow these assigned shapes in order, one per candidate: ${STRUCTS.slice().sort(()=>Math.random()-.5).slice(0,w.n).map((s,i)=>`${i+1}) ${s}`).join('; ')}. The turn where the comedian admits she or he does it too may appear in at most one candidate. SPOKEN: write it as it would be spoken; short paragraphs separated by blank lines, one beat or punchline per line where it helps; pause markers only where timing needs them; minimal stage directions; cut filler. ENDINGS: never summarise or explain in the last line; use a callback, reversal, unexpected final observation, understated line or vivid final image; finish on the strongest line. ORIGINALITY: be fresh because it is truer or funnier, never strange for its own sake; avoid well-worn internet parody phrases. CHARACTER FIT: if an assigned shape conflicts with this character's bible or dislikes (for example sincere or motivational material for someone who dislikes motivation), bend the shape to what this character would actually say, and keep real jokes throughout. TITLE: must name something that actually appears in the piece. Count catchphrases before finishing; never more than one. Do not name recurring family or friends unless the bible already does. Never quote or paraphrase these instructions inside the piece (for example, do not announce that you are completely right just because a shape said so). Plain text only: no markdown, asterisks or headings. LANGUAGE: any non-English word, exclamation, blessing or religious phrase must come from this character's own listed expressions; never invent them, and write in plain English otherwise. Prefer the character's own listed expressions over generic ones, at most one per piece.${S.set.rules?' EDITOR RULES (highest priority): '+S.set.rules:''}\n\nReturn ONLY JSON: {"candidates":[{"title":"...","setup":"...","punchline":"...","text":"full material in the comedian's spoken voice"}]}`,1);list=(r.candidates||[]).map(x=>({...x,demo:false,model:UI.lastModel,text:String(x.text||'').replace(/\*{1,2}([^*\n]+)\*{1,2}/g,'$1').replace(/\*/g,'')}))}

async function dl(name,data){let d=null;try{d=typeof claude!=='undefined'?await claude.use('downloads'):null}catch(e){}if(d){try{await d.save({filename:name,data})}catch(e){if(e.code!=='declined')toast('Export failed: '+(e.message||e.code),1)}return}try{const u=URL.createObjectURL(new Blob([data],{type:'application/octet-stream'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}catch(e){toast('Export failed: '+e.message,1)}}
function csv(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';dl('comedy-vault.csv',['id,comedian,title,subject,format,status,favourite,score,text'].concat(S.jokes.map(j=>[j.id,com(j.cid)?.name,j.title,j.subject,j.format,j.status,j.fav,j.eval?.overall,j.text].map(q).join(','))).join('\n'))}
function impPick(el){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{UI.imf=impAnalyse(JSON.parse(r.result),f.name)}catch(e){UI.imf={err:'This file is not valid JSON.'}}el.value='';render()};r.onerror=()=>{UI.imf={err:'Could not read the file.'};render()};r.readAsText(f)}
function impAnalyse(d,name){let k='',coms=[],jokes=[],perfs=[];
if(Array.isArray(d)){jokes=d.filter(x=>x&&x.text&&x.cid);k='vault of jokes'}
else if(d&&Array.isArray(d.coms)&&Array.isArray(d.jokes)){coms=d.coms;jokes=d.jokes;perfs=d.perfs||[];k='full network backup'}
else if(d&&d.comedian&&d.comedian.id){coms=[d.comedian];jokes=d.jokes||[];perfs=d.performances||[];k='comedian profile'}
else if(d&&d.text&&d.cid){jokes=[d];k='single joke'}
else return{err:'Not a LAUGH LAB export. Expected a network backup, vault, comedian profile or single joke.'};
return{name,k,d,coms,jokes,perfs,hist:k==='full network backup'?(d.hist||[]):[]}}
function impPrevF(){const I=UI.imf;if(I.err)return`<div class="warn err">${esc(I.err)}</div>`;const ids=a=>new Set(a.map(x=>x.id)),hc=ids(S.coms),hj=ids(S.jokes),hp=ids(S.perfs);
return`<div class="warn"><b>${esc(I.name)}</b> (${I.k}) holds ${I.coms.length} comedian(s), ${I.jokes.length} joke(s), ${I.perfs.length} performance(s). New to this app: ${I.coms.filter(x=>!hc.has(x.id)).length} / ${I.jokes.filter(x=>!hj.has(x.id)).length} / ${I.perfs.filter(x=>!hp.has(x.id)).length}.</div>
<div class="mu">Merge adds only what is missing. Merge and update also overwrites comedians that exist in both with the file's version.</div>
<div class="row" style="margin-top:8px"><button class="b" onclick="impMerge(0)">Merge</button>${I.coms.length?'<button class="b" onclick="impMerge(1)">Merge and update comedians</button>':''}${I.k==='full network backup'?'<button class="g d" onclick="impReplace()">Replace everything</button>':''}<button class="g" onclick="UI.imf=null;render()">Cancel</button></div>`}
function impMerge(upd){const I=UI.imf;if(!I||I.err)return;let add=[0,0,0];
I.coms.forEach(c=>{const i=S.coms.findIndex(x=>x.id===c.id);if(i<0){S.coms.push(c);add[0]++}else if(upd){S.coms[i]=c;add[0]++}});
I.jokes.forEach(j=>{if(!S.jokes.some(x=>x.id===j.id)){S.jokes.push(j);add[1]++}});
I.perfs.forEach(p=>{if(!S.perfs.some(x=>x.id===p.id)){S.perfs.push(p);add[2]++}});
(I.hist||[]).forEach(h=>{if(!S.hist.some(x=>x.at===h.at&&x.what===h.what))S.hist.push(h)});S.hist.sort((a,b)=>String(a.at).localeCompare(String(b.at)));const miss=S.jokes.filter(j=>!com(j.cid)).length;log('Merged import: '+I.name);UI.imf=null;save();
toast(`Merged: ${add[0]} comedian(s), ${add[1]} joke(s), ${add[2]} performance(s).`+(miss?` ${miss} joke(s) belong to a comedian not in this app. Import a full backup or that comedian's profile too.`:''),!!miss)}
function impReplace(){const I=UI.imf;if(!I||I.k!=='full network backup')return;if(!cf('Replace ALL data in this app with this file?'))return;const k=S.set||{};S=I.d;S.set=Object.assign({wpm:150,theme:'dark'},I.d.set||{},{gk:k.gk,qk:k.qk,ok:k.ok,gmodel:k.gmodel,pg:k.pg,pe:k.pe});UI.cands=S.cands||[];UI.imf=null;save();toast('Replaced with the backup.')}
